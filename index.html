<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="https://cdn.cycling74.com/rnbo/1.1.0/rnbo.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@latest/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@latest/dist/p5.sound.min.js"></script>
  </head>
  <body>
    <div class="controls">
      </br>
      <button id = "buttonText" onclick="gust()" width="300px"></button>
      </br>
      </br>
      <button id = "buttonStop" onclick="stop()" width="100px"></button>
      </br>
      </br>
      <div id="videoDiv">
        <video width = "420" autoplay muted loop playsinline id="chime-vid"></video>
      </div>
      <input id="delayTime" type="range" min="0.01" max="1.00" step="0.01" oninput="updateDelayTime(this.value)">
      <input id="feedback" type="range" min="0.01" max="0.99" step="0.01" oninput="updateFeedback(this.value)">
      <input id="speed" type="range" min="0.1" max="2.0" step="0.01" oninput="updateSpeed(this.value)">
      <input type="checkbox" id="timeStretch" oninput="updateTimeStretch(this.checked)">
  </body>
  <script src="instrument.js"></script>
</html>
